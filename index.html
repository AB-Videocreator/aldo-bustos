
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aldo Bustos | Coming Soon</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #10060b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: end;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;
      background:
        linear-gradient(0deg, rgba(0,0,0,.88), transparent 75%),
        url("aldo-bustos.jpg") center center / cover no-repeat;
    }

    .message {
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 12px #000;
    }

    h1 {
    font-size: clamp(16px, 3vw, 26px);
    margin: 0 0 1px;
    letter-spacing: 1px;
    }

    h2 {
    color: #ff536d;
    font-size: clamp(12px, 2vw, 20px);
    margin: 0 0 1px;
    }
    p {
    font-size: clamp(10px, 1vw, 15px);
    margin: 0;
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="message">
      <h1>ALDO BUSTOS</h1>
      <h2>SITO IN ALLESTIMENTO</h2>
      <p>Stiamo preparando qualcosa di speciale.</p>
    </div>
  </main>
</body>
</html>
