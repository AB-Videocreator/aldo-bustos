
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aldo Bustos | Coming Soon</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #10060b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: end;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;
      background:
        linear-gradient(0deg, rgba(0,0,0,.88), transparent 75%),
        url("aldo-bustos.jpg") center center / cover no-repeat;
    }

    .message {
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 12px #000;
    }

    h1 {
      font-size: clamp(30px, 6vw, 64px);
      margin: 0 0 15px;
      letter-spacing: 2px;
    }

    h2 {
      color: #ff536d;
      font-size: clamp(20px, 4vw, 34px);
      margin: 0 0 12px;
    }

    p {
      font-size: 17px;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="message">
      <h1>ALDO BUSTOS</h1>
      <h2>SITO IN ALLESTIMENTO</h2>
      <p>Stiamo preparando qualcosa di speciale.</p>
    </div>
  </main>
</body>
</html>
